<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-store">
<title>재고관리 (관리자) — 주소가 변경되었습니다</title>
<link href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable.min.css" rel="stylesheet">
<style>
  *{box-sizing:border-box;margin:0;padding:0}
  body{min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:28px;
       background:#0b0b14;color:#e2e8f0;
       font-family:"Pretendard Variable",-apple-system,"Apple SD Gothic Neo",sans-serif;
       text-align:center;-webkit-font-smoothing:antialiased}
  .card{width:100%;max-width:360px}
  .icon{font-size:46px;margin-bottom:18px}
  h1{font-size:19px;font-weight:800;margin-bottom:6px;letter-spacing:-.3px}
  .sub{font-size:13px;color:#64748b;margin-bottom:24px;font-weight:500}
  .desc{font-size:14px;line-height:1.65;color:#94a3b8;margin-bottom:6px}
  .desc-en{font-size:12px;line-height:1.6;color:#475569;margin-bottom:24px}
  .addr{display:block;background:rgba(99,102,241,.1);border:1px solid rgba(99,102,241,.25);
        border-radius:12px;padding:14px 12px;margin-bottom:22px;
        font-size:13px;font-weight:700;color:#a5b4fc;word-break:break-all;text-decoration:none}
  .go{display:block;padding:15px;border-radius:13px;text-decoration:none;
      background:linear-gradient(135deg,#3b82f6,#6366f1);color:#fff;font-weight:700;font-size:15px}
  .count{margin-top:16px;font-size:12px;color:#475569}
  .hint{margin-top:26px;padding-top:18px;border-top:1px solid rgba(255,255,255,.06);
        font-size:11.5px;line-height:1.7;color:#475569}
</style>
</head>
<body>
<div class="card">
  <div class="icon">📦</div>
  <h1>주소가 변경되었습니다</h1>
  <div class="sub">The address has changed</div>

  <p class="desc">관리자 화면이 새 주소로 옮겨졌습니다.<br>기존 주소는 더 이상 사용되지 않습니다.</p>
  <p class="desc-en">The admin page has moved to a new address.</p>

  <a class="addr" href="https://gm-stock.github.io/admin/">https://gm-stock.github.io/admin/</a>
  <a class="go" href="https://gm-stock.github.io/admin/">새 주소로 이동 · Go to new address</a>
  <div class="count"><span id="c">3</span>초 후 자동으로 이동합니다</div>

  <div class="hint">매장용 화면은 아래 주소입니다.<br><span style='color:#64748b'>https://gm-stock.github.io</span></div>
</div>

<script>
(async () => {
  // 옛 서비스워커와 캐시를 지운다.
  // 이 정리를 하지 않으면 브라우저에 저장된 옛 화면이 계속 떠서
  // 이 안내 페이지조차 보이지 않는 경우가 생긴다.
  try {
    if ("serviceWorker" in navigator) {
      const regs = await navigator.serviceWorker.getRegistrations();
      await Promise.all(regs.map(r => r.unregister()));
    }
    if (window.caches) {
      const keys = await caches.keys();
      await Promise.all(keys.map(k => caches.delete(k)));
    }
  } catch (e) {}

  let n = 3;
  const el = document.getElementById("c");
  const t = setInterval(() => {
    n -= 1;
    if (el) el.textContent = n;
    if (n <= 0) { clearInterval(t); location.replace("https://gm-stock.github.io/admin/"); }
  }, 1000);
})();
</script>
</body>
</html>
